name: Build & Release AgentSwarm Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Installer (NSIS & MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build web, server, and MCP bundles
        run: pnpm build

      - name: Run 11-check isolated MCP, Security & API audit
        run: pnpm exec tsx scripts/mcp_bridge_audit.mjs

      - name: Build Tauri v2 desktop installers
        env:
          CI: true
          SKIP_WEB_BUILD: '1'
        run: pnpm tauri build

      - name: Smoke test Windows installer & compute SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisExe = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $msiPkg = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $nsisExe) { throw 'NSIS setup .exe not produced!' }
          if (-not $msiPkg) { throw 'WiX .msi package not produced!' }

          Write-Host "NSIS Installer: $($nsisExe.Name) | SHA256: $((Get-FileHash $nsisExe.FullName -Algorithm SHA256).Hash)"
          Write-Host "MSI Package: $($msiPkg.Name) | SHA256: $((Get-FileHash $msiPkg.FullName -Algorithm SHA256).Hash)"

          # Silent user-mode install verification on clean Windows runner
          $installRoot = 'C:\agentswarm-ci-install'
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }
          Start-Process -FilePath $nsisExe.FullName -ArgumentList "/S /D=$installRoot" -Wait
          $appExe = Get-ChildItem -Path $installRoot -Filter '*.exe' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike '*uninstall*' } |
            Select-Object -First 1
          if (-not $appExe) {
            if (Test-Path $installRoot) { Get-ChildItem -Recurse -Depth 3 $installRoot | Select-Object FullName }
            throw "Installed application .exe not found under $installRoot after silent install!"
          }
          Write-Host "Verified installed binary: $($appExe.FullName)"

          $nodeBin = Get-ChildItem -Path $installRoot -Recurse -Filter 'node.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          $srvEntry = Get-ChildItem -Path $installRoot -Recurse -Filter 'index.js' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'dist-server[\\/]+index\.js$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $nodeBin -or -not $srvEntry) {
            Get-ChildItem -Recurse -Depth 3 $installRoot | Select-Object FullName
            throw 'Bundled runtime/node.exe or app/dist-server/index.js missing in installed package!'
          }

          $smokeData = Join-Path $env:TEMP 'agentswarm-ci-smoke-data'
          if (Test-Path $smokeData) { Remove-Item -Recurse -Force $smokeData }
          New-Item -ItemType Directory -Force $smokeData | Out-Null

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $nodeBin
          $psi.Arguments = "`"$srvEntry`""
          $psi.WorkingDirectory = Split-Path -Parent (Split-Path -Parent $srvEntry)
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.EnvironmentVariables['NODE_ENV'] = 'production'
          $psi.EnvironmentVariables['PORT'] = '25991'
          $psi.EnvironmentVariables['AGENT_COWORK_DATA_DIR'] = $smokeData
          $psi.EnvironmentVariables['AGENT_SWARM_HOST'] = 'tauri'
          $proc = [System.Diagnostics.Process]::Start($psi)

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 300
              try {
                $h = Invoke-RestMethod -Uri 'http://127.0.0.1:25991/api/health' -TimeoutSec 2
                if ($h.ok -and $h.service -eq 'agent-swarm') {
                  $ready = $true
                  $auth = Invoke-RestMethod -Uri 'http://127.0.0.1:25991/api/auth/status' -TimeoutSec 2
                  if ($auth.remoteAccessEnabled -ne $false) { throw 'Fresh installed DB must default remoteAccessEnabled=false!' }
                  Write-Host "Smoke test verified installed server v$($h.version) ($($h.instanceMode)), remoteAccessEnabled=$($auth.remoteAccessEnabled)"
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw 'Bundled installed server failed /api/health smoke check!' }
          } finally {
            if ($proc -and -not $proc.HasExited) { $proc.Kill() }
            if (Test-Path $smokeData) { Remove-Item -Recurse -Force $smokeData -ErrorAction SilentlyContinue }
            if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot -ErrorAction SilentlyContinue }
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentswarm-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AgentSwarm ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body: |
            ## 下载安装（Windows x64）

            - **推荐下载 `*_x64-setup.exe`**：简体中文向导（NSIS），默认当前用户目录免管理员权限安装，支持直接覆盖升级与保留历史数据。
            - **`*_x64_en-US.msi`**：标准 Windows Installer 部署包（向导界面为英文 `en-US`）。
            - **源码归档 (`Source code`)**：仅供开发者自行构建使用。

            ### 适用环境、前提与安装信任说明
            - **系统要求**：Windows 10 / 11（64 位 `x64`），系统已安装 Microsoft Edge WebView2 运行时。
            - **运行前提**：安装包已自带 Node.js 24 与完整本地服务，打开即可体验离线导览；**调度真实 AI 任务需要本机至少安装并登录一款受支持的 CLI 或桌面 AI 客户端**（本软件不包含云端模型额度）。
            - **签名状态与完整性校验**：本开源版本未购买商业代码签名证书（`NotSigned`），首次打开安装向导如弹出 Microsoft Defender SmartScreen 拦截，可核对下方 GitHub Assets 列出的 **SHA-256 摘要**（`Get-FileHash .\AgentSwarm_*_x64-setup.exe -Algorithm SHA256`）一致后，点击「更多信息 → 仍要运行」。

            ---

            ## ${{ github.ref_name }} 主要改进

            1. **默认仅本机访问（P0 安全收敛）**：启动默认仅绑定 `127.0.0.1`，彻底屏蔽未配对跨设备探测；手机访问需在右上角「仅本机」主动开启、支持按单个设备移除或全部撤销、仅推荐同一 Wi-Fi（关闭 AP 隔离）或 Tailscale/ZeroTier 组网使用（严禁暴露至公网）。
            2. **消除 Windows 后台终端闪窗**：移除 `detached` 启动引起的空控制台闪现与 `agy.exe` 每 10 分钟无感后台轮询，改用系统 GUI 默认程序打开文件与无窗口启动脚本。
            3. **桌面多实例端口隔离与启动自诊断**：通过 `/api/health` 核验实例数据身份，25880 被占用时自动隔离启动至 `25881+` 并在启动画面让用户自由选择；错误日志自动脱敏支持「重启本地服务」与「复制脱敏诊断」。
            4. **更清晰的首次上手与防踩坑交互**：离线导览增加四步引导与新建看板直达按钮；新建看板先选安全目录再查主管就绪状态，支持一键在「文档」建练习目录、未安装主管保留草稿、CLI 三态报错分类；三向冲突跳过文件后明确展示「已还原 X 个、保留较新修改 Y 个」及保护快照跳转。

            ---

            ## 首次使用与数据、升级、回退说明

            - **新手入门路径**：请先阅读 [README 快速上手](https://github.com/Huanzhi0526/AgentSwarm/blob/main/README.md) 与 [完整使用教程](https://github.com/Huanzhi0526/AgentSwarm/blob/main/docs/USAGE_GUIDE.md)。
            - **数据位置与与源码版并存**：桌面安装版默认把数据保存在 `%LOCALAPPDATA%\AgentSwarm\data`（左侧栏底部可实时查看），与源代码开发目录 `./data/` 天然隔离并可通过不同端口同时存在。
            - **升级、回退与卸载**：覆盖安装新版本、回退安装旧版本或执行应用卸载，**均保留 `%LOCALAPPDATA%\AgentSwarm\data` 中的已有会话与快照**（重大升级前也可直接复制备份该文件夹）。
            - **已知限制**：自动待命监听依赖宿主客户端对长工具调用的超时支持；Antigravity 首次接入或更新后需在客户端 MCP 面板刷新一次。
            - **反馈与安全渠道**：功能缺陷请通过 [GitHub Issues](https://github.com/Huanzhi0526/AgentSwarm/issues/new/choose) 提交脱敏诊断；安全漏洞请查阅 [SECURITY.md](https://github.com/Huanzhi0526/AgentSwarm/blob/main/SECURITY.md) 私密上报。
