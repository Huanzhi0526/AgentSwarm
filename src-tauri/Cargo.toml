[package]
name = "agent-swarm"
version = "1.4.0"
description = "AgentSwarm Desktop Multi-Agent CoWork Board and MCP Hub"
authors = ["Huanzhi0526"]
edition = "2021"

[lib]
name = "agent_swarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
